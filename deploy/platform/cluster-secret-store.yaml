# One store for the cluster. Authentication comes from the EKS Pod Identity
# association on the external-secrets service account (infra/aws/main.tf), so
# there are no AWS keys in the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
