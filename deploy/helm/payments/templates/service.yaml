apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "payments.labels" . | nindent 4 }}
spec:
  selector: {{- include "payments.selector" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "payments.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "payments.selector" . | nindent 6 }}
  endpoints:
    - { port: http, path: /metrics, interval: {{ .Values.serviceMonitor.interval }} }
{{- end }}
