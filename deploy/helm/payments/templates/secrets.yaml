{{- if eq .Values.secrets.mode "external" }}
# Pulled from AWS Secrets Manager by External Secrets Operator (EKS Pod Identity).
# DATABASE_URL is assembled in-cluster from the RDS-managed master secret, so the
# password never passes through Git, Helm values or Terraform state.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "payments.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.external.secretStore }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: {{ printf "postgresql+psycopg://{{ .username | urlquery }}:{{ .password | urlquery }}@%s/%s?sslmode=require" .Values.secrets.external.dbEndpoint .Values.secrets.external.dbName | quote }}
        kya-public-key: "{{`{{ .kyaPublicKey }}`}}"
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secrets.external.dbMasterSecretArn | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secrets.external.dbMasterSecretArn | quote }}, property: password }
    - secretKey: kyaPublicKey
      remoteRef: { key: {{ .Values.secrets.external.kyaPublicKeySecret | quote }} }
{{- end }}
