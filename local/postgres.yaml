# Local-only Postgres for kind. On AWS this is RDS (infra/aws/main.tf).
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: payments }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: payments, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: payments }
            - { name: POSTGRES_USER, value: payments }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-local, key: password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "payments"] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
